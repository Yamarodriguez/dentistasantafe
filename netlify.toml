# Despliegue en Netlify. Si la validación falla, no se publica.
[build]
  command = "npm run todo"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# FASE DE PRUEBAS: que Google no indexe nada.
# Quitar este bloque (y poner "indexar": true en src/data/site.json) en la FASE 5.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Caché (análisis SEO 2026-11-15): los archivos de /_astro/ llevan huella en el nombre (cambian de nombre
# si cambian) → 1 año. Las fotos no llevan huella → 30 días (si se reemplaza una foto, cambiarle el nombre).
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# La página de equipo pasó a /dentistas-santa-fe/ (Yama, 2026-11-14).
[[redirects]]
  from = "/equipo/"
  to = "/dentistas-santa-fe/"
  status = 301
  # Astro también genera /equipo/index.html (aviso para el servidor local): sin «force», Netlify sirve ese
  # archivo con 200 en vez del 301, que es lo que necesitan Google y los enlaces viejos.
  force = true
