# Despliegue en Netlify. Si la validación falla, no se publica.
[build]
  command = "npm run todo"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Indexación abierta (Yama, 2026-11-15: «index a todo menos aviso legal y etc.»).
# Las páginas legales no se indexan (también llevan la etiqueta meta, ver Base.astro).
[[headers]]
  for = "/privacidad/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/terminos/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

# Caché (análisis SEO 2026-11-15): los archivos de /_astro/ llevan huella en el nombre (cambian de nombre
# si cambian) → 1 año. Las fotos no llevan huella → 30 días (si se reemplaza una foto, cambiarle el nombre).
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# La página de equipo pasó a /dentistas-santa-fe/ (Yama, 2026-11-14) y luego a /odontologos-santa-fe/
# (Yama, 2026-11-16: «dentista» se queda en la portada). Las dos viejas van directas a la nueva, sin saltos.
[[redirects]]
  from = "/equipo/"
  to = "/odontologos-santa-fe/"
  status = 301
  # Astro también genera /equipo/index.html (aviso para el servidor local): sin «force», Netlify sirve ese
  # archivo con 200 en vez del 301, que es lo que necesitan Google y los enlaces viejos.
  force = true

[[redirects]]
  from = "/dentistas-santa-fe/"
  to = "/odontologos-santa-fe/"
  status = 301
  force = true

# Estética dental se dividió en carillas y blanqueamiento (Yama, 2026-11-15): la URL vieja va a carillas.
[[redirects]]
  from = "/estetica-dental-santa-fe/"
  to = "/carillas-dentales-santa-fe/"
  status = 301
  force = true
